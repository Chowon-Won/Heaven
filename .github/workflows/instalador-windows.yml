# Genera el instalador en un equipo Windows de GitHub y lo publica como
# «Release» (descarga directa del archivo SisFaConAutoFacturador_Setup_X.exe).
name: Instalador Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crear instalador
        shell: powershell
        env:
          PYTHON_EXE: ${{ steps.py.outputs.python-path }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\crear_instalador.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SisFaConAutoFacturador_Setup
          path: build/salida/*.exe
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SisFaCon AutoFacturador 1.0.${{ github.run_number }}
          make_latest: true
          files: build/salida/*.exe
          body: |
            Instalador único de SisFaCon AutoFacturador para Windows 10/11 (64 bits).
            No necesita Internet al instalar: copie el .exe a una memoria USB y ejecútelo en la PC de SisFaCon.
